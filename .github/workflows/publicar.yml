name: Publicar carrossel

# LEIA CONTEXTO.md ANTES DE MEXER AQUI.
#
# Roda direto no runner do GitHub. Nao use `container:`: foi testado e o job
# fica preso em "queued" sem nunca receber maquina.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   IG_USER_ID        17841474007579365
#   IG_ACCESS_TOKEN   token do Usuário do Sistema

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Arquivo em content/ (sem .json). Vazio = o primeiro da fila.'
        required: false
        default: ''
      dry_run:
        description: 'Só hospedar e validar, sem publicar'
        type: boolean
        default: false
  schedule:
    # Horários de Brasília (UTC-3) convertidos para UTC. O de 21h cruza a
    # meia-noite em UTC, por isso vira 00h do dia seguinte.
    #
    # Duas tentativas por horário, e nenhuma no minuto :00. A GitHub avisa na
    # própria documentação que disparos agendados podem atrasar ou ser
    # DESCARTADOS em períodos de carga, e o minuto :00 é o mais concorrido.
    # A segunda tentativa só publica se a primeira não tiver acontecido, porque
    # o publish pergunta à Meta quando saiu o último carrossel antes de agir.
    # Os disparos sao AGENDADOS MAIS CEDO que o alvo de proposito. Entre 05 e
    # 09/ago o agendamento do GitHub atrasou de 30min a 4h36, e tres das quatro
    # publicacoes noturnas sairam depois da meia-noite. Agendando cedo, o atraso
    # cai dentro da faixa aceitavel; e o publish recusa publicar fora dela.
    - cron: '7 13 * * *'    # dispara 10h07 BRT, alvo 12h
    - cron: '47 13 * * *'
    - cron: '27 14 * * *'
    - cron: '7 22 * * *'    # dispara 19h07 BRT, alvo 21h
    - cron: '47 22 * * *'
    - cron: '27 23 * * *'

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Sem teto, um fetch travado segura o job ate o limite de 6h do GitHub e
    # bloqueia os horarios seguintes por causa do grupo de concorrencia.
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnóstico do ambiente
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Instalar pacotes node
        # npm ci usa o lockfile: a versao instalada e sempre a mesma que foi
        # testada. Com `npm install`, um sharp novo sem binario para noble, ou
        # uma reorganizacao do pacote da fonte, derrubaria as publicacoes do dia
        # sem ninguem ter mexido em nada.
        run: npm ci --no-audit --no-fund

      - name: Instalar a fonte de emoji
        # Sem ela o Chromium headless desenha quadrado vazio no lugar do emoji.
        # O apt-get update e obrigatorio, senao o pacote nao e encontrado.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji

      - name: Instalar o Chromium
        # Voltamos a instalar o navegador no runner em vez de usar a imagem
        # oficial do Playwright. O container fazia o job ficar preso em "queued"
        # sem nunca receber maquina: das execucoes 9 a 11, nenhuma iniciou,
        # enquanto todas as 8 anteriores, sem container, iniciaram normalmente.
        # A falha original que motivou o container era outra, e ja foi corrigida:
        # faltava o playwright no package.json.
        run: npx playwright install --with-deps chromium

      - name: Conferir que tudo carrega
        run: |
          node -e "require('playwright'); require('sharp'); console.log('playwright e sharp carregaram')"
          node -e "console.log('playwright', require('playwright/package.json').version)"

      - name: Escolher o carrossel da fila
        id: fila
        env:
          ARQUIVO_PEDIDO: ${{ inputs.arquivo }}
        run: |
          if [ -n "$ARQUIVO_PEDIDO" ]; then
            # O nome vem de campo digitado. Interpolar direto no shell permitiria
            # execucao de comando arbitrario no runner.
            case "$ARQUIVO_PEDIDO" in
              *[!a-zA-Z0-9._-]*) echo "nome de arquivo inválido"; exit 1 ;;
            esac
            ALVO="content/$ARQUIVO_PEDIDO.json"
          else
            # A fila é ordenada pelo prefixo numérico do nome (001-, 002-, ...).
            ALVO=$(ls -1 content/*.json 2>/dev/null | sort | head -1)
          fi
          if [ -z "$ALVO" ] || [ ! -f "$ALVO" ]; then
            # Falha de proposito. Antes o job ficava VERDE com a fila vazia, e o
            # GitHub so notifica em falha: as publicacoes parariam em silencio.
            echo "::error::Fila vazia. Nenhum carrossel para publicar." 
            echo "## Fila vazia" >> $GITHUB_STEP_SUMMARY
            echo "Não há carrosséis em \`content/\`. Nada foi publicado." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # O nome do arquivo tem prefixo numerico (001-...) para controlar a ordem
          # da fila, mas o render grava a saida em out/<slug>, e o slug vem de
          # DENTRO do JSON, sem o prefixo. Ler o slug do arquivo e o unico jeito
          # correto de saber onde os slides vao parar.
          SLUG=$(node -p "require('./$ALVO').slug || ''")
          if [ -z "$SLUG" ] || [ "$SLUG" = "undefined" ]; then
            echo "::error::$ALVO não tem o campo slug."
            exit 1
          fi
          echo "escolhido: $ALVO"
          echo "slug: $SLUG"
          echo "alvo=$ALVO" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Avisar se a fila estiver acabando
        run: |
          RESTANTES=$(ls -1 content/*.json 2>/dev/null | wc -l)
          echo "carrosséis na fila: $RESTANTES" >> $GITHUB_STEP_SUMMARY
          if [ "$RESTANTES" -le 6 ]; then
            echo ":warning: **A fila tem só $RESTANTES carrosséis.** Com 2 publicações por dia, isso é menos de 3 dias." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validar e renderizar
        run: node render/render.js "${{ steps.fila.outputs.alvo }}"

      - name: Publicar
        id: publicacao
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node publish/publish.js "out/${{ steps.fila.outputs.slug }}" --dry-run
            exit 0
          fi

          # Nas execuções agendadas a guarda de 5h evita post duplo entre a
          # tentativa principal e a repescagem. Em execução manual não há
          # guarda: se você mandou publicar, publica.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            set +e
            node publish/publish.js "out/${{ steps.fila.outputs.slug }}" \
              --somente-entre "11:00-15:00,19:00-23:00" \
              --pular-se-publicou-em 3
            CODIGO=$?
            set -e
            if [ $CODIGO -eq 78 ]; then
              echo "pulou=true" >> $GITHUB_OUTPUT
              echo "Já havia carrossel recente. Nada publicado nesta execução." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            exit $CODIGO
          fi

          node publish/publish.js "out/${{ steps.fila.outputs.slug }}"


      - name: Guardar os slides para inspeção
        if: always() && steps.fila.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ steps.fila.outputs.slug }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Arquivar o carrossel publicado
        if: inputs.dry_run != true && steps.publicacao.outputs.pulou != 'true'
        run: |
          mkdir -p publicados
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'atlas-agente'
          git config user.email 'atlas-agente@users.noreply.github.com'
          git mv "${{ steps.fila.outputs.alvo }}" "publicados/$(TZ=America/Sao_Paulo date +%Y-%m-%d)-${{ steps.fila.outputs.slug }}.json"
          cp "out/${{ steps.fila.outputs.slug }}/published.json" "publicados/$(TZ=America/Sao_Paulo date +%Y-%m-%d)-${{ steps.fila.outputs.slug }}.published.json" || true
          git add -A publicados content
          git commit -m "publicado: ${{ steps.fila.outputs.slug }}" || exit 0

          # O proprio publish.js commitou as imagens no branch durante esta mesma
          # execucao, entao o checkout local ficou para tras. Sem trazer esses
          # commits antes, o push e recusado por nao ser fast-forward e o job
          # falha DEPOIS de o post ja ter ido ao ar.
          for tentativa in 1 2 3; do
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { git rebase --abort || true; }
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "arquivado com sucesso"
              exit 0
            fi
            echo "push recusado, tentativa $tentativa"
            sleep 5
          done
          echo "AVISO: o post foi publicado, mas nao consegui arquivar o JSON da fila."
          echo "Mova content/ para publicados/ a mao para o proximo carrossel entrar."
          exit 1
