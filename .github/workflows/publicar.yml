name: Publicar carrossel

# Renderiza e publica no Instagram. Roda no GitHub Actions porque é o único
# ambiente gratuito do stack com acesso de rede à Graph API da Meta.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   IG_USER_ID        17841474007579365
#   IG_ACCESS_TOKEN   token de longa duração
#   META_APP_ID       1456440823172698
#   META_APP_SECRET   chave secreta do app

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Arquivo em content/ (sem .json). Vazio = o mais recente da fila.'
        required: false
        default: ''
      dry_run:
        description: 'Só hospedar e validar, sem publicar'
        type: boolean
        default: false
  schedule:
    # 19h30 no horário de Brasília = 22h30 UTC
    - cron: '30 22 * * *'

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          pip install requests
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Escolher o carrossel da fila
        id: fila
        run: |
          if [ -n "${{ inputs.arquivo }}" ]; then
            ALVO="content/${{ inputs.arquivo }}.json"
          else
            ALVO=$(ls -1 content/*.json 2>/dev/null | head -1)
          fi
          if [ -z "$ALVO" ] || [ ! -f "$ALVO" ]; then
            echo "Fila vazia. Nada a publicar."
            echo "vazio=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "alvo=$ALVO" >> $GITHUB_OUTPUT
          echo "slug=$(basename $ALVO .json)" >> $GITHUB_OUTPUT

      - name: Validar e renderizar
        if: steps.fila.outputs.vazio != 'true'
        run: node render/render.js "${{ steps.fila.outputs.alvo }}"

      - name: Publicar
        if: steps.fila.outputs.vazio != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 publish/publish.py "out/${{ steps.fila.outputs.slug }}" --dry-run
          else
            python3 publish/publish.py "out/${{ steps.fila.outputs.slug }}"
          fi

      - name: Arquivar o carrossel publicado
        if: steps.fila.outputs.vazio != 'true' && inputs.dry_run != true
        run: |
          mkdir -p publicados
          git config user.name  'atlas-agente'
          git config user.email 'atlas-agente@users.noreply.github.com'
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git mv "${{ steps.fila.outputs.alvo }}" "publicados/$(date +%Y-%m-%d)-${{ steps.fila.outputs.slug }}.json"
          cp "out/${{ steps.fila.outputs.slug }}/published.json" "publicados/$(date +%Y-%m-%d)-${{ steps.fila.outputs.slug }}.published.json" || true
          git add -A publicados
          git commit -m "publicado: ${{ steps.fila.outputs.slug }}" || exit 0
          git push origin ${{ github.ref_name }}
